name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  # Wekelijks herbouwen zodat blogs die in Supabase op 'gepubliceerd' zijn gezet
  # op de site landen (dinsdag 06:00 UTC, na de maandagse blog-cron + review).
  schedule:
    - cron: '0 6 * * 2'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name bedrijvenbasis
